name: IELTS Sprint quality checks

on:
  push:
    branches:
      - main
      - "phase-6b/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, build and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Run Cambridge library tests
        run: node --import tsx --test src/utils/__tests__/cambridgeLibrary.test.ts

      - name: Run Listening integrity regression suite
        run: npx tsx src/utils/__tests__/listeningIntegrity.test.ts

      - name: Build production bundle
        run: npm run build
